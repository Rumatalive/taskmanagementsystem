{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Taskroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="/" aria-label="Taskroom home"><span class="brand-mark">+</span><span>taskroom</span></a>
    <p class="eyebrow">Personal workspace</p>
    <h1>Welcome back<span class="accent">.</span></h1>
    <p class="auth-intro">Sign in to keep your tasks in one focused place.</p>
    {% if form.errors %}<p class="form-error">Your username and password did not match.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="primary-button auth-submit" type="submit">Sign in</button>
    </form>
    <p class="auth-switch">New to Taskroom? <a href="{% url 'register' %}">Create an account</a></p>
  </main>
</body>
</html>
